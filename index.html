<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#b8eadc" />
    <meta name="description" content="Küçük Dünya — prosedürel tepeleri ve yumuşak dalgalı deniziyle minik bir adayı keşfet." />
    <title>Küçük Dünya — Ada</title>
  </head>
  <body>
    <main id="app" aria-label="Küçük Dünya ada sahnesi">
      <canvas id="world" aria-label="Prosedürel ada ve su yüzeyi"></canvas>
      <header class="brand-card">
        <span class="eyebrow">KEŞİF DEFTERİ · 01</span>
        <h1>Küçük <i>Dünya</i></h1>
        <p>Rüzgârın, suyun ve yeşil tepelerin arasında küçük bir mola.</p>
      </header>
      <section class="island-card" aria-live="polite">
        <span class="status-dot"></span>
        <div><b id="scene-status">Ada sahnesi hazırlanıyor</b><small id="day-phase">Gün doğumu · 10 dk döngü</small></div>
      </section>
      <aside class="quality-panel">
        <button id="quality-trigger" class="quality-trigger" type="button" aria-expanded="false" aria-controls="quality-menu">
          <span class="settings-glyph" aria-hidden="true">☼</span> Görüntü <b id="quality-summary">Orta</b>
        </button>
        <div id="quality-menu" class="quality-menu" hidden>
          <label for="quality-select">Görüntü kalitesi</label>
          <select id="quality-select">
            <option value="low">Düşük</option>
            <option value="medium" selected>Orta</option>
            <option value="high">Yüksek</option>
          </select>
          <small id="quality-hint">Yumuşak gölgeler ve dengeli çözünürlük</small>
        </div>
      </aside>
      <button id="wave-toggle" class="wave-toggle" type="button" aria-pressed="true">Su dalgaları: açık</button>
      <div id="scene-error" class="error-card" hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
